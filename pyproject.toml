[project]
name = "trival"
version = "0.1.0"
description = "Tri-validation for automatic optimization modeling"
authors = [{name = "Ziyang Fang"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain==1.2.8",
    "langchain-core==1.2.8",
    "langchain-openai==1.1.7",
    "langgraph==1.0.7",
    "ortools==9.15.6755",
    "cvxpy==1.8.0",
    "ecos==2.0.14",
    "numpy==2.4.2",
    "pydantic==2.12.5",
    "python-dotenv==1.2.1",
    "typing-extensions==4.15.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "experiments*"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
